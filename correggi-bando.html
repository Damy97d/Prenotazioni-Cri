<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correggi Bando – CRI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:24px}
.wrap{max-width:820px;margin:0 auto}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:24px;margin-bottom:16px}
h1{font-size:1.35rem;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:#94a3b8;font-size:.9rem;margin-bottom:20px}
label{display:block;font-weight:600;color:#cbd5e1;margin:10px 0 6px;font-size:.9rem}
input,textarea,select{width:100%;padding:11px 12px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#e2e8f0;font-size:1rem}
textarea{min-height:70px;resize:vertical}
.btn{border:none;padding:14px;border-radius:10px;font-weight:700;cursor:pointer;font-size:1rem;width:100%}
.btn-login{background:#c8102e;color:#fff;margin-top:8px}
.btn-ok{background:#16a34a;color:#fff;margin-top:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:#fca5a5;text-align:center;margin-top:10px;display:none;font-weight:600}
.status{margin-top:14px;padding:12px;border-radius:10px;text-align:center;font-weight:600;display:none}
.q{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:14px;margin-bottom:10px}
.q-title{font-weight:600;color:#cbd5e1;margin-bottom:8px}
.badge-ok{color:#4ade80}.badge-no{color:#fca5a5}
.meta{color:#94a3b8;font-size:.85rem;line-height:1.6}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" style="text-align:center">
    <img src="https://upload.wikimedia.org/wikipedia/it/4/4a/Emblema_CRI.svg" alt="CRI" style="height:42px;margin-bottom:10px">
    <h1>Correggi Bando</h1>
    <p class="sub">Croce Rossa Italiana • Area Dirigenza</p>
  </div>

  <div class="card" id="pwdBox">
    <label>Password Dirigenza</label>
    <input type="password" id="pwd" placeholder="DirigenzaCRI">
    <button class="btn btn-login" onclick="checkPwd()">Accedi</button>
    <div class="err" id="pwdErr">Password errata</div>
  </div>

  <div id="content" class="hidden">
    <div class="card meta" id="headerBox"></div>
    <div id="answersBox"></div>
    <div class="card">
      <label>Nota correzione (opzionale)</label>
      <textarea id="nota" placeholder="Eventuale nota..."></textarea>
      <label>Il tuo Nome (firma) *</label>
      <input type="text" id="firmaNome" placeholder="Mario">
      <label>Il tuo Cognome (firma) *</label>
      <input type="text" id="firmaCognome" placeholder="Rossi">
      <label>Il tuo Discord ID (firma) *</label>
      <input type="text" id="firmaDiscord" placeholder="123456789012345678">
      <button class="btn btn-ok" id="btnInvia" onclick="inviaEsito()">✅ Conferma correzione e invia esito</button>
      <div class="status" id="status"></div>
    </div>
  </div>
</div>
<script>
const WEBHOOK = "https://discord.com/api/webhooks/1536994826631782450/HMqHYmSPWDNXKnrhK12iETnPyUeHXSZqByFvgm9Po5UfC1mfGeEWfJ2VE7zaovbdGG79";
const PASS = "DirigenzaCRI";
let record = null;

function b64urlDecode(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  try {
    return decodeURIComponent(escape(atob(str)));
  } catch (e) {
    try { return atob(str); } catch (e2) { return null; }
  }
}

function loadRecord() {
  const params = new URLSearchParams(window.location.search);
  const raw = params.get('d') || params.get('data') || '';
  if (!raw) return null;
  try {
    const json = b64urlDecode(raw);
    const r = JSON.parse(json);
    // normalizza formato slim {t,q,v,ok,c} -> answers standard
    if (r && Array.isArray(r.answers) && r.answers.length && r.answers[0].q !== undefined) {
      r.answers = r.answers.map(a => ({
        type: a.t || a.type,
        text: a.q || a.text,
        value: a.v !== undefined ? a.v : a.value,
        ok: a.ok,
        correct: a.c || a.correct,
        punti: a.punti
      }));
    }
    return r;
  } catch (e) {
    console.error(e);
    return null;
  }
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function checkPwd() {
  const v = document.getElementById('pwd').value;
  if (v === PASS || v === 'DirigenzaCRI') {
    try { localStorage.setItem('accessoDirigenza', 'ok'); } catch(e) {}
    document.getElementById('pwdBox').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');
    document.getElementById('pwdErr').style.display = 'none';
    render();
  } else {
    document.getElementById('pwdErr').style.display = 'block';
  }
}

function render() {
  if (!record) {
    document.getElementById('headerBox').innerHTML = '<span style="color:#fca5a5">Dati bando mancanti o link non valido.</span>';
    document.getElementById('btnInvia').disabled = true;
    return;
  }
  document.getElementById('headerBox').innerHTML =
    `<strong style="color:#fca5a5;font-size:1.1rem">📋 ${esc(record.repartoTitle || record.reparto)}</strong><br>
     👤 <strong>${esc(record.nome)}</strong>
     ${record.discord ? ' · &lt;@' + esc(String(record.discord).replace(/\\D/g,'')) + '&gt;' : ''}<br>
     Grado: ${esc(record.grado || '—')}<br>
     Punteggio automatico: <strong>${record.autoScore ?? 0}</strong> / ${record.maxAuto ?? '—'}
     ${record.min ? ' · Minimo: <strong>' + record.min + '</strong>' : ''}<br>
     <span style="color:#64748b">Ricevuto: ${esc(record.ricevuta || '—')}</span>`;

  const box = document.getElementById('answersBox');
  let html = '';
  (record.answers || []).forEach((a, ai) => {
    if (!a || a.type === 'section') return;
    html += `<div class="q"><div class="q-title">${esc(a.text)}</div>`;
    if (a.type === 'mc') {
      html += `<div>Risposta: <strong>${esc(a.value) || '—'}</strong> `;
      html += a.ok ? '<span class="badge-ok">✅ +2</span>' : '<span class="badge-no">❌ 0</span>';
      html += `</div>`;
      if (!a.ok && a.correct) html += `<div style="color:#94a3b8;font-size:.85rem;margin-top:4px">Corretta: ${esc(a.correct)}</div>`;
    } else if (a.type === 'open') {
      html += `<div style="background:#1e293b;padding:10px;border-radius:8px;margin-bottom:8px;white-space:pre-wrap">${esc(a.value) || '—'}</div>`;
      html += `<label style="display:inline;margin-right:8px">Punteggio (1–3)</label>
        <select id="pts_${ai}" style="width:auto;display:inline-block;padding:6px 10px">
          <option value="1">1</option><option value="2" selected>2</option><option value="3">3</option>
        </select>`;
    } else {
      html += `<div>${esc(a.value) || '—'}</div>`;
    }
    html += `</div>`;
  });
  box.innerHTML = html || '<div class="card">Nessuna risposta</div>';
}

async function inviaEsito() {
  if (!record) return;
  const fNome = (document.getElementById('firmaNome').value || '').trim();
  const fCognome = (document.getElementById('firmaCognome').value || '').trim();
  const fDiscord = (document.getElementById('firmaDiscord').value || '').trim();
  if (!fNome || !fCognome) { alert('Inserisci Nome e Cognome per la firma'); return; }
  if (!/^\\d{17,20}$/.test(fDiscord)) { alert('Discord ID firma non valido'); return; }

  let openScore = 0;
  (record.answers || []).forEach((a, ai) => {
    if (a.type === 'open') {
      const sel = document.getElementById('pts_' + ai);
      const pts = sel ? parseInt(sel.value, 10) : 2;
      a.punti = pts;
      openScore += pts;
    }
  });
  const autoScore = Number(record.autoScore) || 0;
  const total = autoScore + openScore;
  const maxTotal = record.maxTotal || (autoScore + openScore);
  const min = Number(record.min) || 0;
  const passato = !min || total >= min;
  const nota = (document.getElementById('nota').value || '').trim();
  const firma = `**${fNome} ${fCognome}**\\n<@${fDiscord}>`;

  try {
    localStorage.setItem('mieiDatiCRI', JSON.stringify({ nome: fNome, cognome: fCognome, discord: fDiscord }));
  } catch(e) {}

  const status = document.getElementById('status');
  const btn = document.getElementById('btnInvia');
  btn.disabled = true;
  status.style.display = 'block';
  status.style.background = '#fff3cd';
  status.style.color = '#1a1a2e';
  status.innerHTML = '⏳ Invio esito...';

  const disc = String(record.discord || '').replace(/\\D/g, '');
  try {
    const res = await fetch(WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        content: disc ? `<@${disc}>` : '',
        allowed_mentions: { parse: ['users'] },
        embeds: [{
          title: passato
            ? `✅ Bando ${record.repartoTitle || ''} – SUPERATO`
            : `❌ Bando ${record.repartoTitle || ''} – NON SUPERATO`,
          color: passato ? 0x16a34a : 0xc8102e,
          fields: [
            { name: '👤 Candidato', value: `**${record.nome}**`, inline: true },
            { name: '💬 Discord', value: disc ? `<@${disc}>` : '—', inline: true },
            { name: '📊 Punteggio', value: `**${total}** / ${maxTotal}\\nAuto ${autoScore} + Aperte ${openScore}`, inline: true },
            { name: '🎯 Minimo', value: min ? String(min) : '—', inline: true },
            { name: '📋 Esito', value: passato ? '✅ Superato' : '❌ Non superato', inline: true },
            { name: '📝 Nota', value: nota || '—', inline: false },
            { name: '✍️ Corretto da', value: firma, inline: false }
          ],
          footer: { text: 'CRI • Bandi Interni' },
          timestamp: new Date().toISOString()
        }]
      })
    });
    if (!(res.ok || res.status === 204)) throw new Error('Webhook ' + res.status);
    status.style.background = '#d4edda';
    status.innerHTML = '✅ Esito inviato su Discord!';
  } catch (e) {
    status.style.background = '#f8d7da';
    status.innerHTML = '❌ ' + e.message;
    btn.disabled = false;
  }
}

function prefillFirma() {
  try {
    let d = null;
    try { d = JSON.parse(localStorage.getItem('mieiDatiCRI') || 'null'); } catch(e) {}
    if (d) {
      if (d.nome) document.getElementById('firmaNome').value = d.nome;
      if (d.cognome) document.getElementById('firmaCognome').value = d.cognome;
      if (d.discord) document.getElementById('firmaDiscord').value = d.discord;
    }
  } catch(e) {}
}

document.addEventListener('DOMContentLoaded', () => {
  record = loadRecord();
  prefillFirma();
  document.getElementById('pwd').addEventListener('keyup', e => { if (e.key === 'Enter') checkPwd(); });
  try {
    if (localStorage.getItem('accessoDirigenza') === 'ok') {
      document.getElementById('pwdBox').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');
      render();
    }
  } catch(e) {}
  if (!record) {
    document.getElementById('headerBox').innerHTML = '<span style="color:#fca5a5">Link non valido: dati bando assenti.</span>';
  }
});
</script>
</body>
</html>
